; EnergyTrack — ESP32 DevKit (ESP32-WROOM-32) + PZEM-004T v3, ESP-IDF pelo PlatformIO.
;
; Dois firmwares, um por ambiente (o ESP-IDF não aceita build_src_filter: quem
; escolhe as fontes é src/CMakeLists.txt, pela variável ET_APP):
;   pio run -e energytrack_fw          WPS 3.1 — aquisição e processamento em tempo real
;   pio run -e energytrack_selftest    WPS 3.2 — self-test do PZEM, LED e log serial
; Gravar e abrir o monitor: pio run -e energytrack_fw -t upload -t monitor

[platformio]
default_envs = energytrack_fw, energytrack_selftest

[env]
platform = espressif32@8.0.0          ; ESP-IDF 6.1
framework = espidf
board = esp32dev
monitor_speed = 115200
monitor_filters = direct
; Ponte USB-serial do DevKit: DTR/RTS ligados ao EN/GPIO0. Com os dois em 0 o
; monitor não segura a placa em reset nem no modo de gravação.
monitor_rts = 0
monitor_dtr = 0

[env:energytrack_fw]
board_build.cmake_extra_args = -DET_APP=energytrack

[env:energytrack_selftest]
board_build.cmake_extra_args = -DET_APP=selftest
