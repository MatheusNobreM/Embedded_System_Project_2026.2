[project]
name = "energytrack-backend"
version = "0.1.0"
description = "Backend do EnergyTrack: recebe as leituras da placa pelo Wi-Fi, guarda no SQLite e serve a API do app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.165.0",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
energytrack-backend = "energytrack_backend.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["energytrack_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ac(id): critério de aceite da spec backend-api que o teste prova"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
]
