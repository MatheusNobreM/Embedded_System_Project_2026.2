# Migrações do banco do EnergyTrack (Alembic).
#
# O backend aplica as migrações sozinho ao subir. Pela linha de comando, a
# partir da pasta backend/:
#   uv run alembic upgrade head                          aplica no banco padrão
#   uv run alembic revision --autogenerate -m "o que mudou"   nova migração
# O banco vem da variável ET_BANCO ou é backend/dados/energytrack.db
# (alembic/env.py); não há URL fixa aqui.

[alembic]
script_location = %(here)s/alembic
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
